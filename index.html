<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Milionario Semplice</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>



    <div class="container">

        <aside class="sidebar">
            <div class="prize top">€ 1.000.000</div>
            <div class="prize">€ 500.000</div>
            <div class="prize">€ 250.000</div>
            <div class="prize">€ 100.000</div>
            <div class="prize">€ 50.000</div>
            <div class="prize">€ 20.000</div>
            <div class="prize active">€ 10.000</div>
            <!-- esiste la classe "prize done", usata per i premi già vinti -->
        </aside>

        <main class="game">
    <img src="logo.png" alt="Logo" class="logo-img">
            <!-- domanda esempio, le vere sono aggiunte nello script -->
            <div class="question">
                <p id="q-text">Qual è la capitale dell'Italia?</p>
            </div>

            <div class="answers">
                <button class="opt" id="btn-A">
                    <span>A:</span> Roma
                </button>
                <button class="opt" id="btn-B">
                    <span>B:</span> Milano
                </button>
                <button class="opt" id="btn-C">
                    <span>C:</span> Napoli
                </button>
                <button class="opt" id="btn-D">
                    <span>D:</span> Torino
                </button>
            </div>

        </main>

    </div>

</body>

</html>
